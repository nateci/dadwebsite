<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Performance Videos</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #0f2027, #203a43, #2c5364);
      color: #f9f9f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 2rem;
      text-align: center;
      background-color: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    section {
      width: 100%;
      max-width: 1200px;
      padding: 2rem;
      text-align: center;
    }

    section h2 {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #ffffff33;
      display: inline-block;
      padding-bottom: 0.4rem;
    }

    .video-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      margin-top: 1.5rem;
      animation: fadeIn 1s ease-in;
    }

    iframe {
      width: 360px;
      height: 215px;
      border: none;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease;
    }

    iframe:hover {
      transform: scale(1.05);
    }

    .coming-soon {
      font-size: 1.3rem;
      color: #ccc;
      margin-top: 2rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 400px) {
      iframe {
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
      }
    }
  </style>
</head>
<body>


  <h2>Pault Performance 12/18/2023</h2>
  <div class="video-section">
    <iframe src="https://www.youtube.com/embed/XoipporzIcQ" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/UViGMp6TOeM" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/-ny8ykH7XKU" allowfullscreen></iframe>
  </div>

  <h2>Pault Performance 5/12/2025 </h2>
  <div class="video-section">
    <iframe src="https://www.youtube.com/embed/8Hzg0hcQTRI" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/2bWmv3edyrk" allowfullscreen></iframe> 
    <iframe src="https://www.youtube.com/embed/Zx1mb790p3o" allowfullscreen></iframe> 
  </div>

</body>
</html>
